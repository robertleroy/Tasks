version: '3.8'
services:
  tasks-app:
    build: .
    # ports:
    #   - "3002:3000" # Host 3002 -> Container 3000
    restart: always
    volumes:
      # - tasks-db:/app/data # This creates a persistent 'shelf' for your DB
      - /data/apps/tasks:/app/data
    environment:
      - DATABASE_URL=file:/app/data/tasks.db
      - NODE_ENV=production

  caddy:
    image: caddy:2-alpine
    ports:
      - "3002:443"  # HTTPS on host 3002 -> container 443
    volumes:
      # - ./Caddyfile:/etc/caddy/Caddyfile
      # - /home/roble/certs:/certs:ro  # ro = read only
    - /home/roble/caddy/Caddyfile:/etc/caddy/Caddyfile
    - /home/roble/certs:/certs:ro
    restart: always
    depends_on:
      - tasks-app
volumes:
  tasks-db: # This tells Docker to manage a permanent storage area 